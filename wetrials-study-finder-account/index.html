<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeTrials embed — account access prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --n25:#fff; --n50:#f8f8f9; --n100:#f2f3f4; --n200:#ededef; --n300:#e0e0e4;
    --n400:#d4d4d8; --n500:#9f9fa9; --n600:#71717b; --n700:#52525c; --n900:#27272a;
    --n1000:#18181b; --n1100:#09090b; --gray200:#e9ebed;
    --blue100:#c0dff1; --blue500:#3399d3; --blue600:#2e8bc0; --blue850:#003ca5;
    --violet50:#ebebf8; --violet500:#3538b6;
    --succ50:#e4f7f0; --succ200:#96ddc4; --succ400:#2bbc80; --succ700:#237050;
    --warn50:#fff4ec; --warn100:#ffdfc9; --warn200:#ffc296; --warn500:#e56910; --warn700:#a64901;
    --info50:#eaf3ff; --info100:#cde1ff; --info200:#86b9ff; --info700:#0156cd; --info800:#0a336d;
    --err700:#af2f25;
    --purple350:#a70098;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Noto Sans',system-ui,-apple-system,sans-serif;
    background:var(--n100); color:var(--n1100);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  a{color:#246d96}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---------- simulated address strip (link mode only) ---------- */
  #chrome{display:none;position:sticky;top:0;z-index:60;align-items:center;gap:8px;
    padding:8px 12px;background:#1c1c1f;color:#c9c9cf;font-size:12px;letter-spacing:.2px}
  body.simulated #chrome{display:flex}
  #chrome .dot{width:9px;height:9px;border-radius:50%;background:#3a3a40;flex:0 0 auto}
  #chrome .bar{flex:1;min-width:0;display:flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:999px;background:#2a2a2f;overflow:hidden}
  #chrome .host{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e6e6ea}
  #chrome .tag{flex:0 0 auto;padding:3px 8px;border-radius:999px;background:#3a3a40;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px;color:#a5a5ad}

  /* ---------- shells ---------- */
  .page{max-width:1440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .partner-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 20px;background:#fff;border-bottom:1px solid var(--gray200)}
  .partner-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
  .partner-mark{width:32px;height:32px;border-radius:9px;background:#0f5c4a;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:.5px}
  .partner-links{display:none;gap:26px;font-size:14px;color:#3f3f47}
  .partner-cta{display:none;padding:9px 18px;border-radius:999px;background:#0f5c4a;color:#fff;font-size:14px;font-weight:600}
  .hamb{width:44px;height:44px;margin-right:-8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @media(min-width:900px){ .partner-links{display:flex} .partner-cta{display:block} .hamb{display:none} }

  /* ---------- option D: CTA banner above the switcher ---------- */
  .acctbanner{display:flex;align-items:center;gap:10px;padding:6px 10px;
    border-radius:10px;background:var(--n1000)}
  .acctbanner .ic{width:28px;height:28px;border-radius:999px;background:#fff;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .acctbanner .tx{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;flex:1;min-width:0}
  .acctbanner .t1{font-size:14px;font-weight:600;color:#fff;line-height:1.3}
  .acctbanner .t2{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto}
  .acctbanner .bbtn{display:inline-flex;align-items:center;height:44px;padding:0 18px;
    border-radius:8px;background:#fff;color:var(--n1000);font-size:14px;font-weight:600;white-space:nowrap}
  .acctbanner .lnk{display:none;align-items:center;height:44px;padding:0 10px;font-size:14px;
    font-weight:600;color:#fff;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
  .acctbanner .on-lg{display:none}
  @media(min-width:640px){
    .acctbanner .lnk{display:inline-flex}
    .acctbanner .on-sm{display:none}
    .acctbanner .on-lg{display:inline}
  }

  .widget{flex:1;display:flex;flex-direction:column;min-height:0}
  .whead{background:#fff;border-bottom:1px solid var(--n200);padding:16px}
  .wheadin{display:flex;flex-direction:column;gap:12px;width:100%}
  .hrow{display:flex;flex-direction:column;gap:12px;min-width:0}
  .acct-desktop{display:none}
  .wbody{display:flex;flex-direction:column;gap:12px;padding:16px 16px 104px;flex:1}
  .results{display:flex;flex-direction:column;gap:12px;min-width:0}
  .filters{display:none}

  /* filter sidebar (desktop only — on mobile these live behind the filter button) */
  .fcard{display:flex;flex-direction:column;gap:14px;padding:20px;background:#fff;
    border:1px solid var(--gray200);border-radius:8px}
  .fcard .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .fcard .h .l{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700}
  .finput{height:48px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--n300);
    border-radius:8px;font-size:14px;color:var(--n500)}
  .fopt{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--n900)}
  .fbox{width:20px;height:20px;border:1.5px solid var(--n400);border-radius:4px;flex:0 0 auto}
  .fbox.round{border-radius:999px}


  /* ---------- pill + account ---------- */
  .pillrow{display:flex;align-items:center;gap:8px;min-width:0}
  .pillrow > .pill{flex:1 1 auto;min-width:0}
  .pillspacer{display:none}
  .pill{display:flex;align-items:center;gap:8px;min-width:0;padding:8px;border-radius:999px;background:var(--n100)}
  .pill.grow{flex:1;min-width:0}
  .pill-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:44px;margin:-4px 0}
  .pill-ico{width:36px;height:36px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pill-user{width:36px;height:36px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pill-lbl{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill-div{width:1px;height:28px;background:var(--n400);flex:0 0 auto}
  .acct-seg{width:44px;height:44px;margin:-4px 0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .avatar{position:relative;width:36px;height:36px;border-radius:999px;background:var(--blue600);
    color:#fff;font-size:13px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;justify-content:center}
  .avatar .unread{position:absolute;top:-1px;right:-1px;width:13px;height:13px;border-radius:999px;
    background:var(--warn500);border:2px solid var(--n100)}
  .signin-btn{display:flex;align-items:center;gap:6px;height:44px;margin:-4px 0;padding:0 16px;
    border-radius:999px;background:#fff;border:1px solid var(--n400);font-size:15px;font-weight:600;flex:0 0 auto;white-space:nowrap}
  .signin-btn.solo{margin:0}

  /* ---------- search ---------- */
  .searchrow{display:flex;align-items:center;gap:8px}
  .search{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:6px 6px 6px 14px;
    border:1px solid var(--n300);border-radius:999px;background:#fff}
  .search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:14px;background:transparent}
  .search input::placeholder{color:var(--n500)}
  .search .go{width:36px;height:36px;border-radius:999px;background:var(--blue100);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--n300);background:#fff;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .count{font-size:14px;color:var(--n700)}
  .count b{color:var(--n1100)}

  /* ---------- cards ---------- */
  .card{display:flex;flex-direction:column;gap:12px;padding:20px;background:#fff;
    border:1px solid var(--gray200);border-radius:8px;width:100%}
  .card.feat{padding:2px 2px 6px;background:var(--blue850);border:0;border-radius:10px}
  .card.feat > .inner{display:flex;flex-direction:column;gap:12px;padding:20px;background:#fff;border-radius:8px}
  .chips{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .chip{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:500}
  .chip.rec{background:var(--succ50);color:var(--succ700)}
  .chip.nyr{background:var(--warn50);color:var(--warn700)}
  .chip.int{background:var(--violet50);color:var(--violet500)}
  .chip.feat{background:linear-gradient(to right,var(--purple350),var(--blue850));color:#fff}
  @media(min-width:1024px){ .chip.feat{margin-left:auto} }
  .ctitle{font-size:18px;font-weight:600;line-height:1.35}
  .crow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--n700)}
  .crow b{color:var(--n1100);font-weight:500}
  .conds{display:flex;flex-direction:column;border:1px solid var(--n200);border-radius:8px;overflow:hidden}
  .conds .h{display:flex;align-items:center;gap:8px;padding:8px;background:var(--n50);
    border-bottom:1px solid var(--n200);font-size:14px;color:var(--n700)}
  .conds .b{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:#fff}
  .cond{padding:4px 12px;border:1px solid var(--n300);border-radius:8px;font-size:14px;font-weight:500}
  .cfoot{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;color:var(--n600)}
  .cfoot .ai{display:flex;align-items:center;gap:4px}
  @media(min-width:1024px){ .ctitle{font-size:21px} }

  /* ---------- buttons ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;
    border-radius:8px;font-size:15px;font-weight:600}
  .btn.pri{background:var(--n1000);color:#fff}
  .btn.sec{background:#fff;border:1px solid var(--n400)}
  .btn.full{width:100%}
  .btn.sm{height:44px;font-size:14px;padding:0 18px}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(9,9,11,.55);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:#fff;border-radius:16px 16px 0 0;
    transform:translateY(101%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
    max-height:88vh;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));
    pointer-events:none}
  .sheet.on{transform:none;pointer-events:auto}
  @media(min-width:1024px){
    /* right/top are set in JS from the trigger's own box — CSS math went stale
       the moment the content column changed width. These are only fallbacks. */
    .sheet{left:auto;right:32px;bottom:auto;top:150px;
      width:360px;max-height:calc(100vh - 180px);border-radius:14px;
      transform:translateY(-8px) scale(.98);opacity:0;box-shadow:0 24px 70px rgba(9,9,11,.28)}
    .sheet.on{transform:none;opacity:1}
  }
  .grab{display:flex;justify-content:center;padding:8px 0 4px}
  .grab i{width:44px;height:4px;border-radius:999px;background:var(--n300)}
  @media(min-width:1024px){ .grab{display:none} }
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:4px 20px 14px;border-bottom:1px solid var(--gray200)}
  .sheet-id{display:flex;align-items:center;gap:12px;min-width:0}
  .sheet-id .big{width:44px;height:44px;border-radius:999px;background:var(--blue600);color:#fff;
    font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .sheet-id .nm{font-size:16px;font-weight:700}
  .sheet-id .em{font-size:13px;color:var(--n600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xbtn{width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .menu{display:flex;flex-direction:column;padding:12px}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px;
    border-bottom:1px solid var(--n200);width:100%}
  .mrow:last-child{border-bottom:0}
  .mrow .l{display:flex;align-items:center;gap:12px}
  .mrow .ic{width:36px;height:36px;border-radius:999px;background:#fff;border:1px solid var(--n300);
    display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
  .mrow .ic .dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:999px;
    background:var(--warn500);border:2px solid #fff}
  .mrow .t{font-size:16px;font-weight:500;color:var(--n900)}
  .pillnum{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--n100);
    color:var(--n700);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .acctcard{margin:12px;padding:14px;border:1px solid var(--info100);border-radius:10px;background:var(--info50);
    display:flex;flex-direction:column;gap:12px}
  .acctcard .ac-top{display:flex;align-items:flex-start;gap:10px}
  .acctcard .ac-ic{width:32px;height:32px;border-radius:999px;background:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center}
  .acctcard .ac-t{font-size:15px;font-weight:700;color:var(--info800)}
  .acctcard .ac-s{font-size:13px;color:var(--info800);opacity:.8;line-height:1.45}
  .acctcard .ac-actions{display:flex;gap:8px;flex-wrap:wrap}
  .signout{padding:0 20px 16px}
  .signout .inner{padding-top:12px;border-top:1px solid var(--gray200)}
  .signout .t{display:flex;align-items:center;height:44px;font-size:16px;font-weight:600;color:var(--err700)}
  .signout .s{font-size:12px;color:var(--n600);line-height:1.5}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:16px;right:88px;bottom:86px;z-index:80;display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-radius:10px;background:var(--n1000);color:#fff;font-size:14px;font-weight:500;
    box-shadow:0 8px 24px rgba(9,9,11,.28);
    /* the off state must clear the bottom inset too, not just its own height */
    transform:translateY(20px);opacity:0;visibility:hidden;
    transition:transform .24s cubic-bezier(.2,.8,.3,1), opacity .18s, visibility 0s linear .24s}
  #toast.on{transform:none;opacity:1;visibility:visible;transition-delay:0s}
  @media(min-width:1024px){ #toast{left:auto;right:96px;bottom:28px;max-width:360px} }

  /* ---------- portal ---------- */
  .portal{min-height:100vh;background:var(--n50);display:flex;flex-direction:column}
  .pnav{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;background:#fff;border-bottom:1px solid var(--n200)}
  @media(min-width:900px){
    .pnav{padding:16px 24px}
    .pnav > *{max-width:none}
    .pwrap .btn.full{max-width:360px}
  }
  .pback{display:flex;align-items:center;gap:8px;min-width:0}
  .pback .chev{width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pback .tt{font-size:16px;font-weight:700}
  .pback .ss{font-size:12px;color:var(--n600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pwrap{flex:1;width:100%;max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
  .plogin{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;
    width:100%;max-width:420px;margin:0 auto;padding:24px}
  .h1{font-size:24px;font-weight:700;line-height:1.25;text-align:center}
  .sub{font-size:14px;color:var(--n600);text-align:center;line-height:1.5}
  .notice{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--info100);border-radius:8px;
    background:var(--info50);font-size:13px;color:var(--info800);line-height:1.5}
  .notice.bad{border-color:#ffd6d3;background:#ffedec;color:#5e201b}
  .tabs{display:flex;gap:8px}
  .tab{display:flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;
    background:#fff;border:1px solid var(--n300);color:var(--n700);font-size:14px;font-weight:500}
  .tab.on{background:var(--n1000);border-color:var(--n1000);color:#fff;font-weight:600}
  .req{display:flex;flex-direction:column;gap:12px;padding:16px;background:#fff;border:1px solid var(--gray200);border-radius:8px}
  .req .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .req .when{font-size:12px;color:var(--n500)}
  .req .t{font-size:16px;font-weight:600;line-height:1.4}
  .alert{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;
    background:var(--warn50);border:1px solid var(--warn100);font-size:13px;font-weight:500;color:var(--warn700)}
  .step{display:flex;align-items:center;gap:8px}
  .step .n{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;background:#fff;border:1px solid var(--n400);color:var(--n500);flex:0 0 auto}
  .step .n.on{background:var(--n1000);border-color:var(--n1000);color:#fff}
  .step .ln{height:2px;flex:1;background:var(--n300)}
  .opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--n300);border-radius:8px;background:#fff;width:100%}
  .opt.on{border:2px solid var(--n1000);padding:13px}
  .opt .av{width:44px;height:44px;border-radius:999px;background:var(--blue600);color:#fff;
    font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .opt .av.ghost{background:var(--n100);color:var(--n700)}
  .opt .nm{font-size:15px;font-weight:600}
  .opt .mt{font-size:13px;color:var(--n600)}
  .field{display:flex;flex-direction:column;gap:8px}
  .field label{font-size:14px;font-weight:600}
  .field textarea{font:inherit;font-size:15px;padding:12px;border:1px solid var(--n300);border-radius:8px;
    min-height:110px;resize:vertical;outline-color:var(--blue600);width:100%}
  .efoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
  .efoot .stepno{font-size:13px;color:var(--n600);white-space:nowrap}
  .success{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 24px;text-align:center}

  /* ---------- the partner's own footer ---------- */
  .pfoot{background:#0f2e26;color:#cfe0da;padding:28px 16px 20px}
  .pf-in{display:flex;flex-direction:column;gap:20px;max-width:1440px;margin:0 auto}
  .pf-brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:16px;font-weight:700}
  .pf-cols{display:flex;flex-wrap:wrap;gap:24px}
  .pf-cols > span{display:flex;flex-direction:column;gap:6px;min-width:130px}
  .pf-cols b{color:#fff;font-size:13px}
  .pf-cols i{font-style:normal;font-size:13px;opacity:.75}
  .pf-legal{max-width:1440px;margin:20px auto 0;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);
    font-size:12px;opacity:.7}
  @media(min-width:1024px){ .pfoot{padding:36px 32px 24px} .pf-cols{gap:56px} }

  /* ---------- version E: mobile bottom bar ---------- */
  .bbar{display:none}
  @media(max-width:767px){
    .bbar{display:flex;position:sticky;bottom:0;z-index:40;background:#fff;
      border-top:1px solid var(--n200);box-shadow:0 -6px 20px rgba(9,9,11,.06);
      padding-bottom:env(safe-area-inset-bottom)}
    .btab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      height:62px;color:var(--n600);font-size:11px;font-weight:600;letter-spacing:.2px}
    .btab.on{color:var(--n1100)}
    .btab .bi{display:flex}
    .e-mode .pill-chev{display:none}
    body.has-bbar #fab{bottom:82px}
  }

  /* ---------- chat FAB (existing product surface — untouched) ---------- */
  #fab{position:fixed;right:16px;bottom:20px;z-index:50;width:56px;height:56px;border-radius:999px;
    background:var(--blue600);box-shadow:0 6px 18px rgba(9,9,11,.22);display:flex;align-items:center;justify-content:center}

/* =========================================================================
   NAVIGATION — one function for both modes.
   ========================================================================= */
function goto(target, params) {
  const url = SIMULATED ? curURL() : new URL(target === 'portal' ? REAL.portal : REAL.partner);
  if (SIMULATED) {
    url.search = '';
    url.hash = '';
    if (target === 'portal') url.searchParams.set('site', 'portal');
    Object.entries(params.query || {}).forEach(([k, v]) => url.searchParams.set(k, v));
    if (params.hash) url.hash = params.hash;
    j.set(SS, K.simSite, target);
    site = target;
    pushURL(url);
    return;
  }
  url.pathname = location.pathname;
  Object.entries(params.query || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  if (params.hash) url.hash = params.hash;
  if (params.newTab && isDesktop()) { window.open(url.toString(), '_blank'); return; }
  location.href = url.toString();
}

/* =========================================================================
   PARTNER SIDE
   ========================================================================= */
const partner = {
  session:  () => j.get(SS, K.partnerSession),
  route:    () => (curHash() || '#/study').replace(/^#/, ''),

  /* the tap that starts everything */
  signIn(intent = null, mode = null) {
    const s = nonce();
    j.set(SS, K.handoff, {
      s,
      route: partner.route(),
      scrollY: window.scrollY,
      intent,
      at: Date.now(),
    });
    goto('portal', { query: {
      screen: 'signin',
      ret: SIMULATED ? location.origin : REAL.partner,
      route: partner.route(),
      s,
      ...(intent ? { intent } : {}),
      ...(mode ? { mode } : {}),
    }});
  },

  /* the return leg — reads the ticket out of the FRAGMENT and strips it */
  consumeTicket() {
    const raw = curHash() || '';
    const qi = raw.indexOf('?');
    if (qi === -1) return false;
    const p = new URLSearchParams(raw.slice(qi + 1));
    const tkt = p.get('wtAuth');
    const s = p.get('s');
    if (!tkt) return false;

    const pending = j.get(SS, K.handoff);
    let ok = false, payload = null;
    if (pending && pending.s && s === pending.s) {
      try { payload = b64d(tkt); ok = true; } catch { ok = false; }
    }

    // strip the ticket before anything else can read it or it lands in history
    const cleanRoute = raw.slice(0, qi) || '#/study';
    const clean = curURL(); clean.hash = cleanRoute;
    replaceURL(clean);
    j.del(SS, K.handoff);

    if (!ok) { toast('Sign-in could not be verified', true); return false; }

    j.set(SS, K.partnerSession, { name: payload.n, short: payload.sh, initials: payload.i, exp: payload.e });
    setTimeout(() => {
      window.scrollTo(0, pending.scrollY || 0);
      toast(`Signed in as ${payload.sh}`);
      if (pending.intent === 'account') openSheet();
    }, 40);
    return true;
  },

  signOut() {
    j.del(SS, K.partnerSession);
    if (SIMULATED) j.del(LS, K.portalSession); // demo convenience: reset both
    closeSheet();
    render();
    toast('Signed out on ' + PARTNER_LABEL);
  },

  openPortal(screen, extra = {}) {
    closeSheet();
    goto('portal', {
      query: { screen, ret: SIMULATED ? location.origin : REAL.partner, route: partner.route(), ...extra },
      newTab: true,
    });
  },
};

    </div></div>`;
}

const $sheet = document.getElementById('sheet');
const $scrim = document.getElementById('scrim');
const desktopLayout = () => window.matchMedia('(min-width: 1024px)').matches;

/* On desktop the panel hangs off whichever account control is actually visible.
   Measuring the trigger beats hard-coding an offset: it survives the header
   changing width, the D banner adding a row, and any entry option. */
function placeSheet() {
  if (!desktopLayout()) {
    $sheet.style.top = $sheet.style.right = $sheet.style.left = '';
    return;
  }
  const trigger =
    document.querySelector('.acct-desktop [data-act="account"], .acct-desktop [data-act="signin"]') ||
    [...document.querySelectorAll('[data-act="account"],[data-act="signin"]')].find(e => e.offsetParent !== null);
  if (!trigger) return;
  const r = trigger.getBoundingClientRect();
  $sheet.style.top = `${Math.round(r.bottom + 10)}px`;
  $sheet.style.right = `${Math.max(16, Math.round(window.innerWidth - r.right))}px`;
  $sheet.style.left = 'auto';
}

function openSheet() {
  $sheet.innerHTML = sheetHTML();
  placeSheet();
  $sheet.classList.add('on');
  $scrim.classList.add('on');
}
function closeSheet() { $sheet.classList.remove('on'); $scrim.classList.remove('on'); }
window.addEventListener('resize', () => { if ($sheet.classList.contains('on')) placeSheet(); });

/* ---- toast --------------------------------------------------------------- */
let toastT;
function toast(msg, bad = false) {
  const t = document.getElementById('toast');
  t.innerHTML = `${bad ? I.warn('#ffc296', 20) : I.tick()}<span>${esc(msg)}</span>`;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 3200);
}

/* =========================================================================
   PORTAL SIDE
   ========================================================================= */
const portal = {
  session: () => j.get(LS, K.portalSession),
  ret:     () => QS_live().get('ret') || '',
  route:   () => QS_live().get('route') || '/study',
  screen:  () => QS_live().get('screen') || 'requests',
  s:       () => QS_live().get('s') || '',
  intent:  () => QS_live().get('intent') || '',
  nct:     () => QS_live().get('nct') || '',

  returnAllowed() { return ALLOWED_RETURN_ORIGINS.includes(portal.ret()); },

  /* fake the sign-in, then hand a ticket back in the FRAGMENT */
  completeSignIn() {
    j.set(LS, K.portalSession, { name: USER.name, at: Date.now() });
    const tkt = b64e({ n: USER.name, sh: USER.short, i: USER.initials, e: Date.now() + 3600e3 });
    const hash = `${portal.route()}?wtAuth=${encodeURIComponent(tkt)}&s=${encodeURIComponent(portal.s())}`;
    goto('partner', { hash });
  },

  backToPartner() { goto('partner', { hash: portal.route() }); },
};
function QS_live() { return curQS(); }

function portalNav(title) {
  return `<div class="pnav">
      <div class="pback">
        <button class="chev" data-act="p-back" aria-label="Back to ${esc(PARTNER_LABEL)}">${I.chevL()}</button>
        <span><span class="tt">${esc(title)}</span><br><span class="ss">Back to ${esc(PARTNER_LABEL)}</span></span>
      </div>
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--n500)">${I.lock()}${esc(PORTAL_LABEL)}</span>
    </div>`;
}

function renderPortalSignin() {
  const allowed = portal.returnAllowed();
  const creating = QS_live().get('mode') === 'create';
  return `<div class="portal">
    <div class="pnav">
      <span style="display:flex;align-items:center;gap:10px"><span style="display:flex">${I.wt(26)}</span><b style="font-size:16px">WeTrials</b></span>
      <span style="font-size:13px;color:var(--n600)">Patient Portal</span>
    </div>
    <div class="plogin">
      <div>
        <div class="h1">${creating ? 'Create your account' : 'Log in to your account'}</div>
        <div class="sub" style="margin-top:8px">${creating ? 'It takes about a minute' : 'Sign in to access your enrollment portal'}</div>
      </div>
      ${allowed
        ? `<div class="notice">${I.info('#0d67e5', 20)}<span>You'll return to <b>${esc(PARTNER_LABEL)}</b> as soon as you're signed in.</span></div>`
        : `<div class="notice bad">${I.warn('#af2f25', 20)}<span>This site isn't registered for account access, so we can't send you back to it. The origin we saw was <b>${esc(portal.ret() || 'none')}</b>.</span></div>`}
      <div style="display:flex;flex-direction:column;gap:14px">
        <button class="btn sec full" data-act="p-signin" ${allowed ? '' : 'disabled style="opacity:.5"'}>
          ${I.wt(20)}<span>${creating ? 'Continue with WeTrials' : 'Sign in with WeTrials'}</span>
        </button>
        <div style="display:flex;align-items:center;justify-content:center;gap:5px;height:44px;font-size:14px;color:var(--n600)">
          ${creating ? 'Already have an account?' : "Don't have an account?"}
          <span style="font-weight:500;color:var(--n1100);text-decoration:underline;text-underline-offset:2px">${creating ? 'Log in' : 'Create an account'}</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px">${I.lock()}<span style="font-size:12px;color:var(--n500)">${esc(PORTAL_LABEL)}</span></div>
    </div>
  </div>`;
}

function reqCard(r) {
  const state = r.state === 'reviewing'
    ? `<span class="chip" style="background:var(--info50);color:var(--info700);padding:5px 10px;font-size:13px">${I.dot('#86b9ff','#0156cd',16)}Site reviewing</span>`
    : `<span class="chip" style="background:var(--succ50);color:var(--succ700);padding:5px 10px;font-size:13px">${I.dot('#96ddc4','#237050',16)}Submitted</span>`;
  return `<div class="req">
      <div class="top">${state}<span class="when">Updated ${esc(r.when)}</span></div>
      <div class="t">${esc(r.title)}</div>
      <div class="crow" style="font-size:13px">${I.pin()}${esc(r.site)} · ${esc(r.dist)}</div>
      ${r.needsDoc ? `<div class="alert">${I.warn()}1 document still needed</div>` : ''}
    </div>`;
}

function renderPortalRequests() {
  if (!portal.session()) return renderPortalGate('My requests', 'Sign in to see your requests.');
  const reqs = j.get(LS, K.requests, SEED_REQUESTS) || [];
  return `<div class="portal">
    ${portalNav('My requests')}
    <div class="pwrap">
      <div class="tabs"><span class="tab on">Active ${reqs.length}</span><span class="tab">Closed</span></div>
      ${reqs.length ? reqs.map(reqCard).join('') : `<div class="req"><div class="t">No requests yet</div></div>`}
      <button class="btn sec full" data-act="p-back" style="margin-top:8px">${I.chevL('#09090b', 20)}Back to ${esc(PARTNER_LABEL)}</button>
    </div>
  </div>`;
}

function renderPortalSimple(title, body) {
  if (!portal.session()) return renderPortalGate(title, 'Sign in to continue.');
  return `<div class="portal">
    ${portalNav(title)}
    <div class="pwrap">
      <div class="req"><div class="t">${esc(title)}</div>
        <div style="font-size:14px;color:var(--n600);line-height:1.5">${esc(body)}</div></div>
      <button class="btn sec full" data-act="p-back">${I.chevL('#09090b', 20)}Back to ${esc(PARTNER_LABEL)}</button>
    </div>
  </div>`;
}

function renderPortalGate(title, msg) {
  return `<div class="portal">
    ${portalNav(title)}
    <div class="pwrap">
      <div class="req">
        <div class="t">${esc(msg)}</div>
        <button class="btn sec full" data-act="p-signin-inline">${I.wt(20)}<span>Sign in with WeTrials</span></button>
      </div>
      <button class="btn sec full" data-act="p-back">${I.chevL('#09090b', 20)}Back to ${esc(PARTNER_LABEL)}</button>
    </div>
  </div>`;
}

/* enroll: works signed OUT too — that is the point */
let enrollStep = 1;
function renderPortalEnroll() {
  const s = studyBy(portal.nct()) || STUDIES[0];
  const signedIn = !!portal.session();
  const total = 3;
  const stepper = `<div class="step">
      ${[1, 2, 3].map((n, i) => `<span class="n${enrollStep >= n ? ' on' : ''}">${n}</span>${i < 2 ? '<span class="ln"></span>' : ''}`).join('')}
    </div>`;

  let body = '';
  if (enrollStep === 1) {
    body = `<div class="req">
        <div class="t" style="font-size:18px">Who is this for?</div>
        ${signedIn
          ? `<button class="opt on"><span class="av">${esc(USER.initials)}</span>
               <span style="flex:1"><span class="nm">${esc(USER.name)}</span><br><span class="mt">Myself · b. 1978</span></span>
               ${I.tickDark()}</button>`
          : `<button class="opt on"><span class="av ghost">${I.person('#52525c', 22)}</span>
               <span style="flex:1"><span class="nm">Myself</span><br><span class="mt">We'll ask for your details next</span></span>
               ${I.tickDark()}</button>`}
        <button class="opt"><span class="av ghost">${I.plus()}</span><span class="nm">Someone I care for</span></button>
      </div>`;
  } else if (enrollStep === 2) {
    body = `<div class="req">
        <div class="t" style="font-size:18px">Supporting documents</div>
        <div style="font-size:14px;color:var(--n600);line-height:1.5">Recent imaging or pathology reports help the site respond faster. You can add them later.</div>
        <button class="btn sec full">Add a document</button>
      </div>`;
  } else {
    body = `<div class="req">
        <div class="t" style="font-size:18px">Message &amp; site</div>
        <div class="crow" style="font-size:14px">${I.pin()}${esc(s.site)} · ${esc(s.dist)}</div>
        <div class="field">
          <label for="msg">Anything the study team should know?</label>
          <textarea id="msg" placeholder="Optional"></textarea>
        </div>
      </div>`;
  }

  return `<div class="portal">
    ${portalNav("Request to enroll")}
    <div class="pwrap">
      <div class="req" style="gap:6px">
        <div style="font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--n600)">Study</div>
        <div style="font-size:15px;font-weight:600;line-height:1.4">${esc(s.title)}</div>
        <div style="font-size:13px;color:var(--n600)">${esc(s.nct)}</div>
      </div>
      ${!signedIn ? `<div class="notice">${I.info('#0d67e5', 20)}<span>You can start without an account — we'll ask you to sign in before submitting.</span></div>` : ''}
      ${stepper}
      ${body}
      <div class="efoot">
        ${enrollStep > 1 ? `<button class="btn sec sm" data-act="e-back">Back</button>` : ''}
        <span class="stepno">Step ${enrollStep} of ${total}</span>
        <button class="btn pri" data-act="e-next" style="margin-left:auto">${enrollStep === total ? 'Submit request' : 'Continue'}</button>
      </div>
    </div>
  </div>`;
}

function renderPortalDone() {
  const s = studyBy(portal.nct()) || STUDIES[0];
  return `<div class="portal">
    ${portalNav('Request sent')}
    <div class="pwrap">
      <div class="req success">
        ${I.tick(44)}
        <div style="font-size:20px;font-weight:700">Request sent</div>
        <div style="font-size:14px;color:var(--n600);line-height:1.5">${esc(s.site)} will review it and message you here. You'll also get an email.</div>
      </div>
      <button class="btn pri full" data-act="p-back">Back to ${esc(PARTNER_LABEL)}</button>
      <button class="btn sec full" data-act="p-goto-requests">See my requests</button>
    </div>
  </div>`;
}

/* =========================================================================
   RENDER + EVENTS
   ========================================================================= */
const $root = document.getElementById('root');

function render() {
  // In simulated mode there is no page load to boot on, so the return leg has
  // to be picked up on arrival instead. Cheap no-op when there is no ticket.
  if (SIMULATED && site === 'partner') partner.consumeTicket();

  document.getElementById('chrome-host').textContent = site === 'portal' ? PORTAL_LABEL : PARTNER_LABEL;

  if (site === 'portal') {
    const sc = portal.screen();
    let html;
    if (sc === 'signin')        html = renderPortalSignin();
    else if (sc === 'enroll')   html = renderPortalEnroll();
    else if (sc === 'done')     html = renderPortalDone();
    else if (sc === 'messages') html = renderPortalSimple('Messages', 'One unread message from the study team at Toronto Western Hospital.');
    else if (sc === 'profile')  html = renderPortalSimple('My profile', 'Your health summary, documents and sharing settings live here.');
    else if (sc === 'settings') html = renderPortalSimple('Settings', 'Account, notifications and people you care for.');
    else                        html = renderPortalRequests();
    document.body.classList.remove('has-bbar');
    $root.innerHTML = `<div class="page">${html}</div>`;
    document.getElementById('fab')?.remove();
    document.getElementById('demo')?.remove();
    return;
  }

  document.body.classList.toggle('has-bbar', entryOption() === 'E');
  const route = partner.route();
  const m = route.match(/^\/study\/([^?]+)/);
  $root.innerHTML = `<div class="page">${m ? renderPartnerStudy(m[1]) : renderPartnerList()}</div>`;
  mountFab();
  mountDemo();
}

function mountFab() {
  if (document.getElementById('fab')) return;
  const b = el(`<button id="fab" aria-label="Chat with WeTrials">${I.chatDots()}</button>`);
  b.addEventListener('click', () => toast('Chat — existing surface, untouched by this work'));
  document.body.appendChild(b);
}

function mountDemo() {
  document.getElementById('demo')?.remove();
  const cur = entryOption();
  const d = el(`<div id="demo"><span class="lb">Entry</span><span class="opts">
      ${['A', 'B', 'C', 'D', 'E'].map(o => `<button data-opt="${o}" aria-pressed="${o === cur}">${o}</button>`).join('')}
    </span></div>`);
  d.addEventListener('click', (e) => {
    const b = e.target.closest('[data-opt]');
    if (b) setEntryOption(b.dataset.opt);
  });
  document.body.appendChild(d);
}

/* one delegated handler for both sites */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  switch (act) {
    case 'signin':      closeSheet(); partner.signIn(null, t.dataset.mode || null); break;
    case 'partner-menu': toast("Partner Health's own menu — not part of the widget"); break;
    case 'account':     openSheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'signout':     partner.signOut(); break;
    case 'tab-study': setRoute('/study'); break;
    case 'tab-other': toast('Learning Center and Support Program — same widget, other pages'); break;
    case 'switch':
      // In option C the switcher IS the account entry point; elsewhere it only switches pages.
      if (entryOption() === 'C') openSheet();
      else toast('Page switcher — Learning Center, Support Program');
      break;
    case 'study':
      setRoute(`/study/${t.dataset.nct}`);
      break;
    case 'back-list':
      setRoute('/study');
      break;
    case 'enroll':
      enrollStep = 1;
      partner.openPortal('enroll', { nct: t.dataset.nct });
      break;
    case 'portal':
      partner.openPortal(t.dataset.screen);
      break;

    case 'p-signin':        portal.completeSignIn(); break;
    case 'p-signin-inline': {
      // signing in from inside the portal: set the portal's own session, stay put
      j.set(LS, K.portalSession, { name: USER.name, at: Date.now() });
      render();
      break;
    }
    case 'p-back':          portal.backToPartner(); break;
    case 'p-goto-requests': {
      const u = curURL(); u.searchParams.set('screen', 'requests');
      if (SIMULATED) pushURL(u); else location.href = u.toString();
      break;
    }
    case 'e-back': enrollStep = Math.max(1, enrollStep - 1); render(); window.scrollTo(0, 0); break;
    case 'e-next': {
      if (enrollStep < 3) { enrollStep++; render(); window.scrollTo(0, 0); break; }
      if (!portal.session()) { j.set(LS, K.portalSession, { name: USER.name, at: Date.now() }); }
      const reqs = j.get(LS, K.requests, SEED_REQUESTS) || [];
      const s = studyBy(portal.nct()) || STUDIES[0];
      if (!reqs.some(r => r.nct === s.nct)) {
        reqs.unshift({ nct: s.nct, title: s.title, state: 'submitted', when: 'just now', site: s.site, dist: s.dist, needsDoc: false });
      }
      j.set(LS, K.requests, reqs);
      const u = curURL(); u.searchParams.set('screen', 'done');
      if (SIMULATED) pushURL(u); else location.href = u.toString();
      break;
    }
  }
});

$scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
window.addEventListener('popstate', () => {
  if (MEM) return;                       // no real history entries to go back to
  if (SIMULATED) site = curQS().get('site') === 'portal' ? 'portal' : 'partner';
  render();
});

/* ---- boot ---------------------------------------------------------------- */
if (SIMULATED) site = curQS().get('site') === 'portal' ? 'portal' : 'partner';
if (site === 'partner') partner.consumeTicket();
render();
</script>
